  <section id="snack-dietary-reference-intake">
<h1>Snack Dietary Reference Intake<a class="headerlink" href="#snack-dietary-reference-intake" title="Link to this heading">¶</a></h1>
<figure class="align-center" id="id1">
<a class="reference external image-reference" href="../../_images/dietary_reference_intake.jpg"><img alt="Dietary Reference Intake Summary View" src="../../_images/dietary_reference_intake.jpg" />
</a>
<figcaption>
<p><span class="caption-text">This is the daily reference intake (DRI) summary view. Dietary Reference Intakes (DRIs) are a comprehensive set of scientifically developed reference values issued by the Food and Nutrition Board of the National Academies of Sciences, Engineering, and Medicine. DRIs provide quantitative estimates of nutrient intakes used to plan and assess diets for healthy people, moving beyond traditional focus on preventing deficiency diseases to supporting long-term health and reducing chronic disease risk.</span><a class="headerlink" href="#id1" title="Link to this image">¶</a></p>
<div class="legend">
<p>The pink and red numbers are nutrient deficiencies at the Percent of DRI (%DRI) column. The red numbers are part of the total nutrient index (TNI).</p>
</div>
</figcaption>
</figure>
<hr class="docutils" />
<figure class="align-center" id="id2">
<a class="reference external image-reference" href="../../_images/dietary_reference_intake_01.jpg"><img alt="Dietary Reference Intake Summary View" src="../../_images/dietary_reference_intake_01.jpg" />
</a>
<figcaption>
<p><span class="caption-text">When looking at the daily reference intake we may ask ourselves how we can meet those requirements. If you right click on one of those nutrients you can get list of food items that provide it.</span><a class="headerlink" href="#id2" title="Link to this image">¶</a></p>
</figcaption>
</figure>
<hr class="docutils" />
<figure class="align-center" id="id3">
<a class="reference external image-reference" href="../../_images/dietary_reference_intake_02.jpg"><img alt="Dietary Reference Intake Summary View" src="../../_images/dietary_reference_intake_02.jpg" />
</a>
<figcaption>
<p><span class="caption-text">Here is list of food items that provide calcium.</span><a class="headerlink" href="#id3" title="Link to this image">¶</a></p>
</figcaption>
</figure>
